[workspace]
resolver = "3"
members = ["mysql", "mysql-core", "pbt"]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.93"
repository = "https://github.com/shiguredo/mysql-rs"
license = "Apache-2.0"

[workspace.dependencies]
# 暗号処理（ハッシュ、RSA-OAEP）
aws-lc-rs = "1.17"
# 日付・時刻型
chrono = { version = "0.4", features = ["std"] }
# DECIMAL 型
rust_decimal = "1.42"
# PEM 形式の公開鍵・証明書読み込み（sha256_password 認証で使用）
rustls-pki-types = { version = "1.15", features = ["std"] }
# ログ出力
tracing = "0.1"
# テスト時の tracing ログ出力
tracing-subscriber = "0.3"
