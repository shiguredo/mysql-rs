[package]
name = "shiguredo_tokio_mysql"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# INSERT/REPLACE 文の VALUES 句検出
regex = "1.12"
# TLS 設定および rustls crypto provider 切り替え
rustls = {
  version = "0.23",
  default-features = false,
  features = ["aws_lc_rs", "tls12"]
}
# OS 標準の証明書検証（rustls-native-certs の代替）
rustls-platform-verifier = "0.5"
shiguredo_mysql = { path = ".." }
# 非同期ランタイムおよび TCP/TLS ストリーム処理
tokio = {
  version = "1.52",
  features = ["fs", "io-util", "macros", "net", "rt", "time"]
}
# TLS 接続（tokio 上で rustls を動作させる）
tokio-rustls = { version = "0.26", default-features = false }
tracing = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
# Docker ベースの統合テスト
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["mysql"] }
tracing-subscriber = { workspace = true }
